openapi: 3.0.3
info:
  title: Nino's Pizza API
  version: 1.0.0
  description: Table bookings at Nino's Pizza. APIblaze reads this file to build the MCP tools for AI assistants and to work out who may change what.
paths:
  /reservations:
    get:
      operationId: listReservations
      summary: List my bookings
      responses:
        '200':
          description: The caller's bookings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reservation' }
    post:
      operationId: createReservation
      summary: Book a table
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewReservation' }
      responses:
        '201':
          description: Booked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
  /reservations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getReservation
      summary: Get one booking
      responses:
        '200':
          description: The booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
    delete:
      operationId: cancelReservation
      summary: Cancel a booking
      responses:
        '204': { description: Cancelled }
components:
  schemas:
    NewReservation:
      type: object
      required: [table, time]
      properties:
        name: { type: string, example: Ana, description: 'Optional: defaults to the signed-in person. Do not ask for it.' }
        table: { type: integer, example: 4 }
        time: { type: string, example: '19:30', description: 'Time of the booking, 24h HH:MM' }
        guests: { type: integer, example: 2, description: 'How many people' }
    Reservation:
      allOf:
        - $ref: '#/components/schemas/NewReservation'
        - type: object
          properties:
            id: { type: string, example: r1 }
